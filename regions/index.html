<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10">
    <title>Nb1X · ModdedCrew</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #0b0d10;
            color: #fff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            margin-bottom: 0.8rem;
            position: relative;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e63946;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.3), 0 0 60px rgba(230, 57, 70, 0.1);
            transition: all 0.3s ease;
            display: block;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.5), 0 0 80px rgba(230, 57, 70, 0.2);
            border-color: #ff6b7a;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .logo {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #f0f0f0, #c0c0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            line-height: 1.2;
            position: relative;
        }

        .logo .red-x {
            background: linear-gradient(145deg, #e63946, #b71c1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e63946, transparent);
            border-radius: 2px;
            opacity: 0.7;
        }

        .description {
            color: #a0a5b0;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-top: 0.8rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.25rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .description::before {
            content: '●';
            color: #e63946;
            font-size: 0.6rem;
            margin-right: 6px;
            opacity: 0.8;
            vertical-align: middle;
        }

        .message {
            width: 100%;
            padding: 25px 20px;
            background: #1a1d24;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            margin-bottom: 1rem;
            text-align: center;
        }

        .message p {
            font-size: clamp(16px, 4vw, 19px);
            line-height: 1.65;
            color: #efeff1;
        }

        .highlight {
            color: #e63946;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.25);
        }

        .warning-box {
            width: 100%;
            padding: 16px 20px;
            background: rgba(230, 57, 70, 0.06);
            border: 1px solid rgba(230, 57, 70, 0.2);
            border-radius: 14px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .warning-box p {
            font-size: clamp(15px, 3.8vw, 18px);
            line-height: 1.5;
            color: #efeff1;
        }

        .warning-box a {
            color: #e63946;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid #e63946;
            transition: 0.2s;
        }

        .warning-box a:hover {
            color: #ff6b7a;
            border-bottom-color: #ff6b7a;
        }

        .play-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .play-button {
            width: 100%;
            min-height: 64px;
            border: 2px solid #e63946;
            border-radius: 60px;
            background: #1a1d24;
            color: #efeff1;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.6rem 1.2rem;
        }

        .play-button::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: #e63946;
            border-radius: 0 3px 3px 0;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .play-button:hover {
            background: #262b34;
            border-color: rgba(230, 57, 70, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(230, 57, 70, 0.1);
        }

        .play-button:hover::before {
            opacity: 1;
            height: 28px;
        }

        .play-button:active {
            transform: scale(0.97);
        }

        .play-button i {
            color: #e63946;
            font-size: 1.2rem;
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2.4rem;
            }
            .avatar {
                width: 80px;
                height: 80px;
            }
            .header::after {
                width: 30px;
            }
            .play-button {
                font-size: 1rem;
                min-height: 56px;
            }
        }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <main class="page">

        <div class="avatar-wrapper">
            <img class="avatar" src="https://i.postimg.cc/wjcLkPHr/Screenshot-2026-08-13-22-03-31-934-com-lemon-lvoverseas-edit.jpg" alt="Nb1X avatar" />
        </div>

        <div class="header">
            <span class="logo">Nb1<span class="red-x">X</span></span>
        </div>

        <div class="description">Join Nb1X's modded lobbies</div>

        <div class="message">
            <p>
                Thanks for supporting me!
                To join the lobby, start <span class="highlight">Among Us</span>,
                go back to your browser, press the button below,
                go to the public lobbies and select the
                <span class="highlight">ModdedCrew</span> region.
                The lobby will appear and join it!
            </p>
        </div>

        <div class="warning-box">
            <p>
                For Starlight users, click
                <a href="https://nb1x.github.io/regions/starlight.html">
                    here
                </a>
            </p>
        </div>

        <div class="warning-box">
            <p>
                Using Windows? Click
                <a href="https://nb1x.github.io/regions/windows.html">
                    here
                </a>
            </p>
        </div>

        <div class="play-container">
            <button class="play-button" onclick="joinLobby()">
                <i class="fas fa-rocket"></i> Play
            </button>
        </div>

    </main>

    <script>
        const canvas = document.getElementById("stars");
        const ctx = canvas.getContext("2d");

        let stars = [];
        let width;
        let height;
        let density;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            density = Math.min(180, Math.max(70, Math.floor(width * height / 6500)));

            stars = [];

            for (let i = 0; i < density; i++) {
                stars.push(createStar(true));
            }
        }

        function createStar(randomX = false) {
            const size = Math.random() * 1.7 + 0.4;

            return {
                x: randomX ? Math.random() * width : -20,
                y: Math.random() * height,
                size: size,
                speed: Math.random() * 1.8 + 0.5,
                length: Math.random() * 12 + 3,
                opacity: Math.random() * 0.65 + 0.3
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            for (const star of stars) {
                const gradient = ctx.createLinearGradient(
                    star.x - star.length,
                    star.y,
                    star.x,
                    star.y
                );

                gradient.addColorStop(0, "rgba(255,255,255,0)");
                gradient.addColorStop(
                    1,
                    `rgba(255,255,255,${star.opacity})`
                );

                ctx.beginPath();
                ctx.strokeStyle = gradient;
                ctx.lineWidth = star.size;
                ctx.moveTo(star.x - star.length, star.y);
                ctx.lineTo(star.x, star.y);
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                star.x += star.speed;

                if (star.x - star.length > width) {
                    Object.assign(star, createStar(false));
                    star.x = -star.length;
                }
            }

            requestAnimationFrame(draw);
        }

        function joinLobby() {
            window.location.href =
                "amongus://init?servername=ModdedCrew(EU)&serverport=443&serverip=https%3A%2F%2Fmoddedcrew.duckdns.org&usedtls=false";
        }

        window.addEventListener("resize", resize);

        resize();
        draw();
    </script>

</body>
</html>
