<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nb1X - Among Us modder</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --card-bg: rgba(22, 27, 34, 0.75);
            --topbar-bg: rgba(13, 17, 23, 0.85);
            --red-primary: #ff3b30;
            --red-glow: rgba(255, 59, 48, 0.35);
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: rgba(255, 59, 48, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 59, 48, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 59, 48, 0.05) 0%, transparent 40%);
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Bar */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
        }

        .topbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .topbar-brand span.highlight {
            color: var(--red-primary);
            text-shadow: 0 0 10px var(--red-glow);
        }

        /* Main Content & Centered Popup */
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--red-glow);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 480px;
            width: 90%;
            position: relative;
            margin-top: 60px; /* Offset for topbar */
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-primary), transparent);
            box-shadow: 0 0 10px var(--red-primary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--red-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--red-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-primary);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Dots */
        .dots span {
            display: inline-block;
            color: var(--red-primary);
            font-weight: bold;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            40% {
                transform: translateY(-6px);
                opacity: 1;
                text-shadow: 0 0 8px var(--red-primary);
            }
        }

        p {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="topbar-brand">
            <span class="highlight">Nb1X</span> - Among Us modder
        </div>
    </header>

    <!-- Centered Popup / Card -->
    <main class="container">
        <div class="badge">
            <span class="status-dot"></span> Work in Progress
        </div>
        <h1>
            Website in development
            <span class="dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </h1>
        <p>This page is under development. Come back later!</p>
    </main>

</body>
</html>
