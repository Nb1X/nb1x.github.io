<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nb1X</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --card-bg: rgba(22, 27, 34, 0.75);
            --topbar-bg: rgba(13, 17, 23, 0.85);
            --menu-bg: rgba(18, 22, 29, 0.95);
            --red-primary: #ff3b30;
            --red-glow: rgba(255, 59, 48, 0.35);
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-color: rgba(255, 59, 48, 0.25);
            --discord-color: #5865F2;
            --github-color: #24292e;
            --github-border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 59, 48, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 59, 48, 0.05) 0%, transparent 40%);
            overflow-x: hidden;
            position: relative;
        }

        /* Top Navigation Bar */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .topbar-brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .topbar-brand span.highlight {
            color: var(--red-primary);
            text-shadow: 0 0 10px var(--red-glow);
        }

        /* Hamburger Menu Button */
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            padding: 0;
            z-index: 101;
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        .menu-btn:hover span {
            background-color: var(--red-primary);
            box-shadow: 0 0 8px var(--red-glow);
        }

        /* Hamburger Animation when Active */
        .menu-btn.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .menu-btn.active span:nth-child(2) {
            opacity: 0;
        }
        .menu-btn.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 65px;
            right: 24px;
            background: var(--menu-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 0;
            width: 160px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--red-glow);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s ease-in-out;
            z-index: 99;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-menu a:hover {
            background: rgba(255, 59, 48, 0.15);
            color: var(--red-primary);
        }

        /* Main Content Container */
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--red-glow);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 440px;
            width: 90%;
            position: relative;
            margin-top: 60px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-primary), transparent);
            box-shadow: 0 0 10px var(--red-primary);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Separator Line */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            margin: 24px 0;
            border: none;
        }

        .oauth-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* OAuth Buttons */
        .oauth-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .oauth-btn-discord {
            background-color: var(--discord-color);
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.25);
        }

        .oauth-btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.4);
        }

        .oauth-btn-github {
            background-color: var(--github-color);
            border: 1px solid var(--github-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .oauth-btn-github:hover {
            background-color: #2c3137;
            border-color: var(--text-sub);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        .oauth-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 59, 48, 0.9);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="topbar">
        <a href="index.html" class="topbar-brand">
            <span class="highlight">Nb1X</span> - Among Us modder
        </a>
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <!-- Dropdown Menu -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html">Home</a>
            <a href="login.html">Log In</a>
        </div>
    </header>

    <!-- Main Login Card -->
    <main class="container">
        <h1>Login is currently disabled</h1>
        <p class="subtitle">Come back later!</p>

        <hr class="divider">

        <h2 class="oauth-title">OAuth2 logins</h2>

        <div class="oauth-btn-group">
            <button class="oauth-btn oauth-btn-discord" onclick="showToast()">
                <svg viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0,3.36,6.83A97.68,97.68,0,0,0,42.29,6.83,72.37,72.37,0,0,0,45.65,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74C48.91,40.23,54,45.92,53.86,53,53.86,60,48.81,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74C91.13,40.23,96.2,45.92,96.08,53,96.08,60,91.03,65.69,84.69,65.69Z"/>
                </svg>
                Log In with Discord
            </button>

            <button class="oauth-btn oauth-btn-github" onclick="showToast()">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Log In with GitHub
            </button>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">OAuth is temporarily disabled!</div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const toast = document.getElementById('toast');
        let toastTimeout;

        // Toggle Navbar Menu
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuBtn.classList.toggle('active');
            dropdownMenu.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!dropdownMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                menuBtn.classList.remove('active');
                dropdownMenu.classList.remove('active');
            }
        });

        // Show Toast Function
        function showToast() {
            clearTimeout(toastTimeout);
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>

</body>
</html>
