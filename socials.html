        * {
            margin: 0;

            box-sizing: border-box;

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1.5rem;
            background: #0b0d10;
            overflow-x: hidden;
            position: relative;

        .shooting-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            width: 2.5px;
            height: 2.5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px 1px rgba(255, 255, 255, 0.5);
            animation: shoot linear infinite;
            opacity: 0;
        }

        .dot-red {
            background: #e63946;
            box-shadow: 0 0 6px 2px rgba(230, 57, 70, 0.7);
            width: 3px;
            height: 3px;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0) scale(0.7);
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateX(120vw) translateY(calc(-40vh + 80vh * var(--y-dir, 0.5))) scale(1.1);
                opacity: 0;
            }
        }

        .card {
            max-width: 560px;
            width: 100%;
            background: transparent;
            display: flex;

            position: relative;
            z-index: 2;

        .avatar-wrapper {

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e63946;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.3), 0 0 60px rgba(230, 57, 70, 0.1);
            transition: all 0.3s ease;
            display: block;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.5), 0 0 80px rgba(230, 57, 70, 0.2);
            border-color: #ff6b7a;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .nb1x {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #f0f0f0, #c0c0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            line-height: 1.2;
            position: relative;
        }

        .nb1x .red-x {
            background: linear-gradient(145deg, #e63946, #b71c1c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.5);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e63946, transparent);
            border-radius: 2px;
            opacity: 0.7;
        }

            letter-spacing: 0.3px;
            margin-top: 0.8rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.25rem 1rem;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .description::before {
            content: '●';
            color: #e63946;
            font-size: 0.6rem;
            margin-right: 6px;
            opacity: 0.8;
            vertical-align: middle;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: #1a1d24;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 0.6rem 1.2rem 0.6rem 0.9rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .link-btn:hover {
            background: #262b34;
            border-color: rgba(230, 57, 70, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(230, 57, 70, 0.1);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: #e63946;
            border-radius: 0 3px 3px 0;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .link-btn:hover::before {
            opacity: 1;
            height: 28px;
        }

        .btn-left {

            align-items: center;

            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #0e1117;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s ease;
        }

        .link-btn:hover .logo-wrapper {
            border-color: rgba(230, 57, 70, 0.3);
        }

        .logo-wrapper img {

            height: 100%;
            object-fit: cover;
            display: block;

        .btn-text {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #efeff1;
        }

        .btn-text .highlight {
            color: #e63946;
            font-weight: 600;
        }

        .arrow-icon {
            color: #8e94a2;
            font-size: 1.1rem;
            margin-left: 0.3rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(4px);
            color: #e63946;
        }

        .logo-wrapper img {
            object-fit: contain;
            background: #0e1117;
        }

        @media (max-width: 480px) {

            }
            .header::after {

            }
            .avatar {
